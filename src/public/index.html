<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant</title>
  
  <!-- Fonts: Cormorant Garamond (Editorial Serif) & DM Sans (Modern Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables & Theming */
    :root {
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="dark"] {
      --bg-main: #121316;
      --bg-surface: #181a1f;
      --bg-pill: #191b20;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text-heading: #737887;
      --text-hero: #f3f5f8;
      --text-user: #8a91a0;
      --text-muted: #525765;
      --text-input: #f1f5f9;
      --icon-color: #737887;
      --icon-hover: #f1f5f9;
      --badge-bg: #22252c;
      --badge-text: #c5cbd8;
      --modal-overlay: rgba(0, 0, 0, 0.65);
      --shadow-modal: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --bg-pill: #ffffff;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(0, 0, 0, 0.18);
      --text-heading: #64748b;
      --text-hero: #0f172a;
      --text-user: #475569;
      --text-muted: #94a3b8;
      --text-input: #0f172a;
      --icon-color: #64748b;
      --icon-hover: #0f172a;
      --badge-bg: #e2e8f0;
      --badge-text: #334155;
      --modal-overlay: rgba(15, 23, 42, 0.45);
      --shadow-modal: 0 24px 60px rgba(15, 23, 42, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-hero);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
      position: relative;
    }

    /* Fixed Top-Right Utility Icons (Stacked) */
    .top-actions {
      position: fixed;
      top: 1.75rem;
      right: 2.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      align-items: center;
      z-index: 40;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--icon-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem;
      border-radius: 8px;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .icon-btn:hover {
      color: var(--icon-hover);
      transform: scale(1.06);
    }

    .icon-btn svg {
      width: 21px;
      height: 21px;
      stroke-width: 1.6;
    }

    /* Main Container */
    main {
      flex: 1;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 3.5rem 2rem 8.5rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    /* Editorial Greeting Headline */
    .greeting-header {
      margin-bottom: 2.5rem;
      margin-top: 1rem;
      transition: opacity 0.3s ease;
    }

    .greeting-title {
      font-family: var(--font-serif);
      font-size: clamp(2.4rem, 4.5vw, 3.75rem);
      font-weight: 400;
      letter-spacing: -0.015em;
      color: var(--text-heading);
      line-height: 1.15;
    }

    /* Conversation Area */
    #conversation {
      display: flex;
      flex-direction: column;
      gap: 2.25rem;
      width: 100%;
    }

    .exchange {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      animation: fadeIn 0.25s ease forwards;
    }

    .user-query {
      font-family: var(--font-sans);
      font-size: 1.02rem;
      font-weight: 400;
      color: var(--text-user);
      line-height: 1.45;
    }

    .user-attachment-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      margin-right: 0.5rem;
    }

    .assistant-answer {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 3.8vw, 3.25rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--text-hero);
      line-height: 1.15;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .assistant-answer.thinking {
      color: var(--text-muted);
      font-style: italic;
    }

    /* Message Actions Row (Regenerate, Copy) */
    .message-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      margin-top: 0.2rem;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.2rem;
      transition: color 0.15s ease, transform 0.1s ease;
    }

    .action-btn:hover {
      color: var(--icon-hover);
      transform: scale(1.08);
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Disambiguation Choice Chips */
    .choices-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .choice-chip {
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-user);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .choice-chip:hover {
      border-color: var(--border-hover);
      color: var(--text-hero);
      background: var(--badge-bg);
    }

    /* Floating Pill Input Bar */
    .input-wrapper {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 3.5rem);
      max-width: 820px;
      z-index: 30;
    }

    .input-pill {
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 0.55rem 0.9rem 0.55rem 1.15rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.22);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-pill:focus-within {
      border-color: var(--border-hover);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.32);
    }

    .attach-btn {
      background: none;
      border: none;
      color: var(--icon-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.25rem;
      transition: color 0.15s ease;
    }

    .attach-btn:hover {
      color: var(--icon-hover);
    }

    .attach-btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.7;
    }

    #file-input { display: none; }

    /* Attachment Tag Inside Input */
    .attachment-tag {
      display: none;
      align-items: center;
      gap: 0.4rem;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      white-space: nowrap;
      user-select: none;
    }

    .attachment-tag.active {
      display: inline-flex;
    }

    .attachment-remove {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 0.2rem;
    }

    .attachment-remove:hover {
      color: var(--icon-hover);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-sans);
      font-size: 1rem;
      color: var(--text-input);
      padding: 0.4rem 0.2rem;
    }

    .chat-input::placeholder {
      color: var(--text-muted);
    }

    .send-submit-btn {
      background: none;
      border: none;
      color: var(--icon-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.3rem;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .send-submit-btn.ready {
      color: var(--text-hero);
    }

    .send-submit-btn:hover {
      color: var(--icon-hover);
      transform: translateX(1px);
    }

    .send-submit-btn svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.8;
    }

    /* Modal Overlay (History Chats) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
      animation: fadeIn 0.2s ease forwards;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      width: 100%;
      max-width: 580px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-modal);
      overflow: hidden;
      animation: modalSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .modal-header {
      padding: 1.5rem 1.75rem 1rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
    }

    .modal-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 400;
      color: var(--text-hero);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--icon-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0.35rem;
      border-radius: 6px;
    }

    .modal-close:hover { color: var(--icon-hover); }

    .modal-body {
      padding: 1.25rem 1.75rem;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .history-item {
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .history-item:hover {
      border-color: var(--border-hover);
      background: var(--badge-bg);
    }

    .history-query {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text-hero);
    }

    .history-answer {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      color: var(--text-heading);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-time {
      font-size: 0.72rem;
      color: var(--text-muted);
      align-self: flex-end;
    }

    .modal-footer {
      padding: 1rem 1.75rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-text {
      background: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s;
    }

    .btn-text:hover { color: var(--icon-hover); }

    .btn-primary {
      background: var(--badge-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-hero);
      font-family: var(--font-sans);
      font-size: 0.85rem;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .btn-primary:hover { border-color: var(--border-hover); }

    /* Copied Tooltip Toast */
    .toast {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-hero);
      font-size: 0.85rem;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 120;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalSlide {
      from { transform: translateY(12px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Slide-Out Side Panel (Database Explorer) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 80;
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(940px, 94vw);
      background: var(--bg-surface);
      border-left: 1px solid var(--border-subtle);
      box-shadow: -16px 0 50px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      z-index: 90;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 1.5rem 2rem 1.1rem 2rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .drawer-title-group {
      display: flex;
      align-items: baseline;
      gap: 0.85rem;
    }

    .drawer-title {
      font-family: var(--font-serif);
      font-size: 2.1rem;
      font-weight: 400;
      color: var(--text-hero);
      line-height: 1.1;
    }

    .drawer-badge {
      font-size: 0.75rem;
      font-family: var(--font-sans);
      color: var(--text-muted);
      background: var(--badge-bg);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      letter-spacing: 0.02em;
    }

    .drawer-header-actions {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .scope-toggle {
      display: inline-flex;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 2px;
      gap: 2px;
    }

    .scope-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .scope-btn.active {
      background: var(--badge-bg);
      color: var(--text-hero);
    }

    .drawer-icon-btn {
      background: none;
      border: none;
      color: var(--icon-color);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem;
      border-radius: 6px;
      transition: color 0.15s, transform 0.1s;
    }

    .drawer-icon-btn:hover {
      color: var(--icon-hover);
      transform: scale(1.08);
    }

    .drawer-icon-btn svg {
      width: 19px;
      height: 19px;
    }

    /* Table Navigation Tabs */
    .table-tabs-container {
      padding: 0.85rem 2rem;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-main);
      overflow-x: auto;
      white-space: nowrap;
    }

    .table-tabs {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .table-tab-btn {
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-user);
      font-family: var(--font-sans);
      font-size: 0.84rem;
      font-weight: 500;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.15s ease;
      text-transform: capitalize;
    }

    .table-tab-btn:hover {
      border-color: var(--border-hover);
      color: var(--text-hero);
    }

    .table-tab-btn.active {
      background: var(--badge-bg);
      border-color: var(--border-hover);
      color: var(--text-hero);
    }

    .tab-count {
      font-size: 0.72rem;
      background: var(--bg-main);
      color: var(--text-muted);
      padding: 0.1rem 0.45rem;
      border-radius: 9999px;
    }

    .table-tab-btn.active .tab-count {
      background: var(--bg-surface);
      color: var(--text-hero);
    }

    /* Drawer Body & Table Layout */
    .drawer-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 1rem 2rem 2rem 2rem;
      gap: 0.85rem;
    }

    .table-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .table-meta-text {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .table-search-input {
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-input);
      font-family: var(--font-sans);
      font-size: 0.82rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      outline: none;
      width: 220px;
      transition: border-color 0.15s;
    }

    .table-search-input:focus {
      border-color: var(--border-hover);
    }

    .table-scroll-wrapper {
      flex: 1;
      overflow: auto;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      background: var(--bg-surface);
    }

    .db-table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      text-align: left;
    }

    .db-table th {
      position: sticky;
      top: 0;
      background: var(--bg-pill);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      z-index: 5;
    }

    .db-table td {
      padding: 0.65rem 1rem;
      color: var(--text-hero);
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
      white-space: nowrap;
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .db-table tr:hover td {
      background: rgba(255, 255, 255, 0.025);
    }

    [data-theme="light"] .db-table tr:hover td {
      background: rgba(0, 0, 0, 0.02);
    }

    .db-table td.col-pk {
      color: var(--text-muted);
      font-family: monospace;
      font-size: 0.8rem;
    }

    .db-badge {
      display: inline-block;
      padding: 0.18rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--badge-bg);
      color: var(--badge-text);
    }

    .db-badge.badge-success {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .db-badge.badge-pending {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
    }

    .table-empty {
      padding: 4rem 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- Top Right Utility Actions (History & Theme Toggle) -->
  <div class="top-actions">
    <!-- History Icon -->
    <button class="icon-btn" id="history-toggle-btn" title="Chat History">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <polyline points="12 7 12 12 15 14"></polyline>
        <path d="M3.05 11a9 9 0 0 1 .5-2m-.5 2H6m-3 0V8"></path>
      </svg>
    </button>

    <!-- Database Explorer Icon -->
    <button class="icon-btn" id="db-toggle-btn" title="Database Tables & Records">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
      </svg>
    </button>

    <!-- Dark/Light Theme Toggle -->
    <button class="icon-btn" id="theme-toggle-btn" title="Toggle Theme">
      <!-- Sun icon (for switching to light in dark mode) -->
      <svg id="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <!-- Moon icon (for switching to dark in light mode) -->
      <svg id="theme-icon-moon" style="display:none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <main>
    <!-- Dynamic Editorial Greeting (e.g. Hello AB, Good Morning) -->
    <div class="greeting-header" id="greeting-box">
      <h1 class="greeting-title" id="greeting-title">Hello AB, Good Morning</h1>
    </div>

    <!-- Active Conversation Display -->
    <div id="conversation"></div>
  </main>

  <!-- Bottom Floating Input Pill Bar -->
  <div class="input-wrapper">
    <form class="input-pill" id="chat-form">
      <!-- Attachment Trigger -->
      <label class="attach-btn" title="Attach file or screenshot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
        </svg>
        <input type="file" id="file-input" accept="image/*,application/pdf" />
      </label>

      <!-- Attachment Pill Badge (when file chosen) -->
      <div class="attachment-tag" id="attachment-tag">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span id="attachment-name">file.png</span>
        <button type="button" class="attachment-remove" id="attachment-remove" title="Remove attachment">✕</button>
      </div>

      <!-- Text Input -->
      <input type="text" class="chat-input" id="message-input" placeholder="Type your Message" autocomplete="off" />

      <!-- Send Arrow Button -->
      <button type="submit" class="send-submit-btn" id="send-button" title="Send message">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </form>
  </div>

  <!-- Centered Modal Overlay for Chat History -->
  <div class="modal-overlay" id="history-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Chat History</h2>
        <button class="modal-close" id="modal-close-btn" title="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="history-list">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer">
        <button class="btn-text" id="clear-history-btn">Clear History</button>
        <button class="btn-primary" id="new-chat-btn">+ New Chat</button>
      </div>
    </div>
  </div>

  <!-- Slide-Out Side Panel for Database Records -->
  <div class="drawer-overlay" id="db-drawer-overlay"></div>
  <div class="drawer" id="db-drawer">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <h2 class="drawer-title">Database Records</h2>
        <span class="drawer-badge" id="db-name-badge">assistant.db • SQLite</span>
      </div>
      <div class="drawer-header-actions">
        <div class="scope-toggle">
          <button type="button" class="scope-btn active" id="scope-user-btn" title="Show records for current user">My Data</button>
          <button type="button" class="scope-btn" id="scope-all-btn" title="Show all stored records">All Records</button>
        </div>
        <button type="button" class="drawer-icon-btn" id="db-refresh-btn" title="Refresh records">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
          </svg>
        </button>
        <button type="button" class="drawer-icon-btn" id="db-close-btn" title="Close drawer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Table Navigation Tabs -->
    <div class="table-tabs-container">
      <div class="table-tabs" id="table-tabs"></div>
    </div>

    <!-- Active Table Content -->
    <div class="drawer-body">
      <div class="table-meta-bar">
        <span class="table-meta-text" id="table-meta-text">Loading tables...</span>
        <input type="text" class="table-search-input" id="table-search-input" placeholder="Search rows..." autocomplete="off" />
      </div>
      <div class="table-scroll-wrapper">
        <table class="db-table" id="db-table">
          <thead id="db-table-head"></thead>
          <tbody id="db-table-body"></tbody>
        </table>
        <div class="table-empty" id="table-empty" style="display:none;">
          No records found in this table.
        </div>
      </div>
    </div>
  </div>

  <!-- Copied Toast -->
  <div class="toast" id="toast">Copied to clipboard</div>

  <script>
    // --- 1. User & Session Setup ---
    let userId = localStorage.getItem('assistant_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('assistant_user_id', userId);
    }

    // --- 2. Dynamic Greeting (Hello AB, Good Morning / Afternoon / Evening) ---
    function updateGreeting() {
      const hour = new Date().getHours();
      let timeOfDay = 'Good Morning';
      if (hour >= 12 && hour < 17) {
        timeOfDay = 'Good Afternoon';
      } else if (hour >= 17 || hour < 4) {
        timeOfDay = 'Good Evening';
      }
      document.getElementById('greeting-title').textContent = `Hello AB, ${timeOfDay}`;
    }
    updateGreeting();

    // --- 3. Dark / Light Mode Switch ---
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle-btn');
    const sunIcon = document.getElementById('theme-icon-sun');
    const moonIcon = document.getElementById('theme-icon-moon');

    const savedTheme = localStorage.getItem('assistant_theme') || 'dark';
    applyTheme(savedTheme);

    function applyTheme(theme) {
      htmlEl.setAttribute('data-theme', theme);
      localStorage.setItem('assistant_theme', theme);
      if (theme === 'dark') {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      } else {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      }
    }

    themeBtn.addEventListener('click', () => {
      const current = htmlEl.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // --- 4. History Storage & Modal ---
    const historyModal = document.getElementById('history-modal');
    const historyToggleBtn = document.getElementById('history-toggle-btn');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const historyList = document.getElementById('history-list');
    const clearHistoryBtn = document.getElementById('clear-history-btn');
    const newChatBtn = document.getElementById('new-chat-btn');

    function getStoredHistory() {
      try {
        return JSON.parse(localStorage.getItem('assistant_chat_history') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveToHistory(userText, assistantText) {
      const history = getStoredHistory();
      history.unshift({
        id: Date.now(),
        query: userText,
        answer: assistantText,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        date: new Date().toLocaleDateString([], { month: 'short', day: 'numeric' })
      });
      // Keep up to 50 items
      if (history.length > 50) history.pop();
      localStorage.setItem('assistant_chat_history', JSON.stringify(history));
    }

    function renderHistoryModal() {
      const history = getStoredHistory();
      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding:2rem;">No chat history yet.</p>`;
        return;
      }
      history.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div class="history-query">${escapeHtml(item.query)}</div>
          <div class="history-answer">${escapeHtml(item.answer)}</div>
          <div class="history-time">${item.date} • ${item.time}</div>
        `;
        div.addEventListener('click', () => {
          // Restore selected item into conversation view
          greetingBox.style.display = 'none';
          appendExchange(item.query, item.answer, null, false);
          closeHistoryModal();
        });
        historyList.appendChild(div);
      });
    }

    function openHistoryModal() {
      renderHistoryModal();
      historyModal.classList.add('open');
    }

    function closeHistoryModal() {
      historyModal.classList.remove('open');
    }

    historyToggleBtn.addEventListener('click', openHistoryModal);
    modalCloseBtn.addEventListener('click', closeHistoryModal);
    historyModal.addEventListener('click', (e) => {
      if (e.target === historyModal) closeHistoryModal();
    });

    clearHistoryBtn.addEventListener('click', () => {
      if (confirm('Clear all chat history?')) {
        localStorage.removeItem('assistant_chat_history');
        renderHistoryModal();
      }
    });

    newChatBtn.addEventListener('click', () => {
      conversationDiv.innerHTML = '';
      greetingBox.style.display = 'block';
      closeHistoryModal();
    });

    // --- 5. Attachment Handling ---
    const fileInput = document.getElementById('file-input');
    const attachmentTag = document.getElementById('attachment-tag');
    const attachmentName = document.getElementById('attachment-name');
    const attachmentRemove = document.getElementById('attachment-remove');
    let currentAttachment = null;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) {
        currentAttachment = {
          name: file.name,
          type: 'image',
          mimeType: file.type
        };
        attachmentName.textContent = file.name;
        attachmentTag.classList.add('active');
        messageInput.focus();
      }
    });

    attachmentRemove.addEventListener('click', () => {
      currentAttachment = null;
      fileInput.value = '';
      attachmentTag.classList.remove('active');
    });

    // --- 6. Chat Interaction & Rendering ---
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    const conversationDiv = document.getElementById('conversation');
    const greetingBox = document.getElementById('greeting-box');
    const toast = document.getElementById('toast');

    messageInput.addEventListener('input', () => {
      if (messageInput.value.trim().length > 0) {
        sendButton.classList.add('ready');
      } else {
        sendButton.classList.remove('ready');
      }
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    // Append exchange strictly matching Screenshot 3
    function appendExchange(userText, assistantText, choices = null, isThinking = false, attachedFile = null) {
      const exchangeEl = document.createElement('div');
      exchangeEl.className = 'exchange';

      // User Query
      const queryEl = document.createElement('div');
      queryEl.className = 'user-query';
      if (attachedFile) {
        queryEl.innerHTML = `<span class="user-attachment-pill">📎 ${escapeHtml(attachedFile)}</span> ` + escapeHtml(userText);
      } else {
        queryEl.textContent = userText;
      }
      exchangeEl.appendChild(queryEl);

      // Assistant Answer
      const answerEl = document.createElement('div');
      answerEl.className = `assistant-answer ${isThinking ? 'thinking' : ''}`;
      answerEl.textContent = assistantText;
      exchangeEl.appendChild(answerEl);

      // Actions Row (Regenerate & Copy) - only for resolved replies
      if (!isThinking) {
        const actionsRow = document.createElement('div');
        actionsRow.className = 'message-actions';

        // Retry / Regenerate button
        const retryBtn = document.createElement('button');
        retryBtn.className = 'action-btn';
        retryBtn.title = 'Retry';
        retryBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
          </svg>
        `;
        retryBtn.onclick = () => {
          messageInput.value = userText;
          chatForm.dispatchEvent(new Event('submit'));
        };

        // Copy button
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn';
        copyBtn.title = 'Copy';
        copyBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        `;
        copyBtn.onclick = async () => {
          try {
            await navigator.clipboard.writeText(assistantText);
            showToast('Copied to clipboard');
          } catch (e) {
            showToast('Failed to copy');
          }
        };

        actionsRow.appendChild(retryBtn);
        actionsRow.appendChild(copyBtn);
        exchangeEl.appendChild(actionsRow);
      }

      // Disambiguation Choices if provided
      if (choices && choices.length > 0) {
        const choicesRow = document.createElement('div');
        choicesRow.className = 'choices-row';
        choices.forEach((choice, idx) => {
          const chip = document.createElement('button');
          chip.className = 'choice-chip';
          chip.textContent = choice;
          chip.onclick = () => {
            messageInput.value = (idx + 1).toString();
            chatForm.dispatchEvent(new Event('submit'));
          };
          choicesRow.appendChild(chip);
        });
        exchangeEl.appendChild(choicesRow);
      }

      conversationDiv.appendChild(exchangeEl);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      return { exchangeEl, answerEl };
    }

    // Submit handler
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text && !currentAttachment) return;

      const attachedFileName = currentAttachment ? currentAttachment.name : null;
      const attachmentPayload = currentAttachment ? { type: 'image', mimeType: currentAttachment.mimeType } : null;

      // Clear input
      messageInput.value = '';
      sendButton.classList.remove('ready');
      attachmentTag.classList.remove('active');
      fileInput.value = '';
      currentAttachment = null;

      // Hide hero greeting once first interaction happens
      greetingBox.style.display = 'none';

      // Create thinking placeholder
      const { exchangeEl, answerEl } = appendExchange(text, 'Thinking....', null, true, attachedFileName);

      try {
        const res = await fetch('/api/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId,
            text,
            attachment: attachmentPayload
          })
        });

        const data = await res.json();
        conversationDiv.removeChild(exchangeEl);

        if (data.ok && data.reply) {
          const replyText = data.reply.text || 'Done.';
          appendExchange(text, replyText, data.reply.choices, false, attachedFileName);
          saveToHistory(text, replyText);
        } else {
          appendExchange(text, 'Could not complete request.', null, false, attachedFileName);
        }
      } catch (err) {
        conversationDiv.removeChild(exchangeEl);
        appendExchange(text, `Connection error: ${err.message}`, null, false, attachedFileName);
      }
    });

    // --- 7. Server-Sent Events (SSE) for Real-Time Reminders ---
    function connectSSE() {
      const evtSource = new EventSource(`/api/stream?userId=${userId}`);

      evtSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.type === 'connected') return;
          if (data.text) {
            greetingBox.style.display = 'none';
            appendExchange('Reminder Notification', data.text, null, false);
            saveToHistory('Reminder Notification', data.text);
          }
        } catch (err) {}
      };

      evtSource.onerror = () => {
        evtSource.close();
        setTimeout(connectSSE, 4000);
      };
    }
    connectSSE();

    // --- 8. Database Records Drawer ---
    const dbToggleBtn = document.getElementById('db-toggle-btn');
    const dbDrawer = document.getElementById('db-drawer');
    const dbDrawerOverlay = document.getElementById('db-drawer-overlay');
    const dbCloseBtn = document.getElementById('db-close-btn');
    const dbRefreshBtn = document.getElementById('db-refresh-btn');
    const scopeUserBtn = document.getElementById('scope-user-btn');
    const scopeAllBtn = document.getElementById('scope-all-btn');
    const tableTabs = document.getElementById('table-tabs');
    const tableMetaText = document.getElementById('table-meta-text');
    const tableSearchInput = document.getElementById('table-search-input');
    const dbTableHead = document.getElementById('db-table-head');
    const dbTableBody = document.getElementById('db-table-body');
    const tableEmpty = document.getElementById('table-empty');

    let currentScope = 'user';
    let databaseData = null;
    let selectedTableName = null;

    function openDbDrawer() {
      dbDrawer.classList.add('open');
      dbDrawerOverlay.classList.add('open');
      loadDatabaseRecords();
    }

    function closeDbDrawer() {
      dbDrawer.classList.remove('open');
      dbDrawerOverlay.classList.remove('open');
    }

    dbToggleBtn.addEventListener('click', openDbDrawer);
    dbCloseBtn.addEventListener('click', closeDbDrawer);
    dbDrawerOverlay.addEventListener('click', closeDbDrawer);

    scopeUserBtn.addEventListener('click', () => {
      if (currentScope === 'user') return;
      currentScope = 'user';
      scopeUserBtn.classList.add('active');
      scopeAllBtn.classList.remove('active');
      loadDatabaseRecords();
    });

    scopeAllBtn.addEventListener('click', () => {
      if (currentScope === 'all') return;
      currentScope = 'all';
      scopeAllBtn.classList.add('active');
      scopeUserBtn.classList.remove('active');
      loadDatabaseRecords();
    });

    dbRefreshBtn.addEventListener('click', () => {
      loadDatabaseRecords();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeDbDrawer();
        closeHistoryModal();
      }
    });

    async function loadDatabaseRecords() {
      tableMetaText.textContent = 'Fetching records from assistant.db...';
      try {
        const res = await fetch(`/api/database/records?userId=${encodeURIComponent(userId)}&scope=${currentScope}`);
        const data = await res.json();
        if (!data.ok || !data.tables) {
          tableMetaText.textContent = 'Failed to load records.';
          return;
        }

        databaseData = data.tables;
        const tableKeys = Object.keys(databaseData);

        if (!selectedTableName || !databaseData[selectedTableName]) {
          selectedTableName = tableKeys[0] || null;
        }

        renderTableTabs(tableKeys);
        renderActiveTable();
      } catch (err) {
        tableMetaText.textContent = `Error loading database: ${err.message}`;
      }
    }

    function renderTableTabs(tableKeys) {
      tableTabs.innerHTML = '';
      tableKeys.forEach((tName) => {
        const info = databaseData[tName];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `table-tab-btn ${tName === selectedTableName ? 'active' : ''}`;
        
        // Friendly display name
        const displayName = tName.replace(/_/g, ' ');
        btn.innerHTML = `
          <span>${escapeHtml(displayName)}</span>
          <span class="tab-count">${info.count}</span>
        `;
        btn.onclick = () => {
          selectedTableName = tName;
          document.querySelectorAll('.table-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          tableSearchInput.value = '';
          renderActiveTable();
        };
        tableTabs.appendChild(btn);
      });
    }

    function formatCellValue(colName, val) {
      if (val === null || val === undefined) return '<span style="color:var(--text-muted)">NULL</span>';
      
      // Timestamp fields
      if (['created_at', 'updated_at', 'due_timestamp', 'delivered_at'].includes(colName) && typeof val === 'number') {
        const d = new Date(val);
        if (!isNaN(d.getTime())) {
          return `<span title="${d.toISOString()}">${escapeHtml(d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }))}</span>`;
        }
      }

      // Status badges
      if (colName === 'status') {
        const statusClass = val === 'completed' || val === 'delivered' ? 'badge-success' : 'badge-pending';
        return `<span class="db-badge ${statusClass}">${escapeHtml(String(val))}</span>`;
      }

      // Category / Channel badge
      if (colName === 'category' || colName === 'channel') {
        return `<span class="db-badge">${escapeHtml(String(val))}</span>`;
      }

      // Amount with currency
      if (colName === 'amount') {
        return `<strong>${Number(val).toLocaleString()}</strong>`;
      }

      // ID
      if (colName === 'id') {
        return `<span class="col-pk">#${escapeHtml(String(val))}</span>`;
      }

      const str = String(val);
      return escapeHtml(str);
    }

    function renderActiveTable() {
      if (!selectedTableName || !databaseData[selectedTableName]) {
        dbTableHead.innerHTML = '';
        dbTableBody.innerHTML = '';
        tableEmpty.style.display = 'block';
        tableMetaText.textContent = 'No table selected';
        return;
      }

      const info = databaseData[selectedTableName];
      const columns = info.columns;
      let rows = info.rows || [];

      // Apply client-side search filter
      const filterQuery = (tableSearchInput.value || '').trim().toLowerCase();
      if (filterQuery) {
        rows = rows.filter(r => {
          return Object.values(r).some(v => v !== null && v !== undefined && String(v).toLowerCase().includes(filterQuery));
        });
      }

      tableMetaText.textContent = `Table: ${selectedTableName} • ${rows.length} of ${info.count} records (${currentScope === 'user' ? 'My Data' : 'All Database Records'})`;

      // Render Head
      let headHtml = '<tr>';
      columns.forEach(col => {
        headHtml += `<th>${escapeHtml(col.name)}</th>`;
      });
      headHtml += '</tr>';
      dbTableHead.innerHTML = headHtml;

      // Render Body
      if (rows.length === 0) {
        dbTableBody.innerHTML = '';
        tableEmpty.style.display = 'block';
        return;
      }

      tableEmpty.style.display = 'none';
      let bodyHtml = '';
      rows.forEach(row => {
        bodyHtml += '<tr>';
        columns.forEach(col => {
          bodyHtml += `<td>${formatCellValue(col.name, row[col.name])}</td>`;
        });
        bodyHtml += '</tr>';
      });
      dbTableBody.innerHTML = bodyHtml;
    }

    tableSearchInput.addEventListener('input', () => {
      renderActiveTable();
    });
